# Test databases for the eloquent-go suite. Start them, then run the tests
# against each engine:
#
#   docker compose up -d --wait
#   just test-all        # sqlite + postgres + mysql + mariadb + duckdb
#                        # + clickhouse + mongo + qdrant
#
# Each engine gets two empty databases: "eloquent" (default connection) and
# "eloquent_audit" (the example's second connection).
services:
  postgres:
    # pgvector's image is stock Postgres plus the vector extension.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: eloquent
      POSTGRES_PASSWORD: eloquent
      POSTGRES_DB: eloquent
    ports: ["127.0.0.1:54329:5432"]
    volumes:
      - ./testdata/docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eloquent -d eloquent_audit"]
      interval: 2s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: eloquent
      MYSQL_USER: eloquent
      MYSQL_PASSWORD: eloquent
      MYSQL_DATABASE: eloquent
    ports: ["127.0.0.1:33069:3306"]
    volumes:
      - ./testdata/docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysql -ueloquent -peloquent -h127.0.0.1 -e 'SELECT 1' eloquent_audit"]
      interval: 2s
      timeout: 5s
      retries: 60

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: eloquent
      MARIADB_USER: eloquent
      MARIADB_PASSWORD: eloquent
      MARIADB_DATABASE: eloquent
    ports: ["127.0.0.1:33070:3306"]
    volumes:
      - ./testdata/docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 60

  clickhouse:
    image: clickhouse/clickhouse-server:25.9-alpine
    environment:
      CLICKHOUSE_PASSWORD: eloquent
    volumes:
      - ./testdata/docker/clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:18123:8123"]
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    tmpfs: [/var/lib/clickhouse]
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 5s
      retries: 30

  mongo:
    image: mongo:8
    ports: ["127.0.0.1:17017:27017"]
    tmpfs: [/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports: ["127.0.0.1:16333:6333"]
    tmpfs: [/qdrant/storage]
